<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101012">
<title>FontSense — Find similar fonts</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#f5f5f6;background:#101012;--muted:#aaaab6;--line:#34343b;--accent:#ff660a}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0}button,input{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}button:disabled{cursor:wait;opacity:.5}:focus-visible{outline:3px solid #ffb47f;outline-offset:4px}
main{width:min(1080px,calc(100% - 40px));margin:auto;padding:38px 0 50px}header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:34px}h1{font-size:32px;letter-spacing:-1.4px;margin:0}header p{color:var(--muted);font-size:14px;margin:0}.brand-dot{color:var(--accent)}.workspace{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:30px;align-items:start}
.upload{border:1px dashed #55555f;border-radius:18px;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#19191d;position:relative;overflow:hidden}.upload.dragging{border-color:var(--accent);background:#27201c}.upload label{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;cursor:pointer;padding:25px;text-align:center}.upload strong{font-size:18px}.upload span{color:var(--muted);font-size:13px}.file-input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;z-index:2}#preview{width:100%;height:300px;object-fit:contain;padding:20px;background:#f8f8f8}.remove{position:absolute;top:12px;right:12px;z-index:3;border:1px solid #c6c6ca;color:#222;background:#fff;border-radius:7px;padding:7px 12px;font-size:12px}
.actions{display:flex;gap:10px;margin-top:16px}.primary{background:var(--accent);border:0;border-radius:10px;color:#fff;font-weight:700;padding:16px 24px;flex:1}.secondary{border:1px solid var(--line);border-radius:10px;background:transparent;color:#d4d4dd;padding:12px 18px}.status{font-size:13px;line-height:1.5;min-height:20px;color:var(--muted);margin:12px 2px}.status.error{color:#ffaaaa}
.empty{min-height:370px;display:grid;place-content:center;text-align:center;border:1px solid #25252b;border-radius:18px;color:var(--muted);padding:30px}.empty h2{font-size:20px;color:#dddde5;font-weight:550;margin:0 0 12px}.empty p{font-size:14px;max-width:250px;line-height:1.5;margin:0}.result-heading{display:flex;justify-content:space-between;gap:16px;align-items:center;margin:0 0 16px}.result-heading h2{font-size:22px;letter-spacing:-.4px;margin:0}.pill{border:1px solid #5c4331;border-radius:999px;background:#2b211a;color:#ffb57d;padding:6px 12px;font-size:12px;white-space:nowrap}.match{border:1px solid var(--line);border-radius:13px;margin-bottom:12px;overflow:hidden;background:#19191e}.match-top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px}.match-name{display:flex;gap:12px;align-items:baseline}.rank{font-size:12px;color:var(--muted)}.match h3{margin:0;font-size:16px;font-weight:650}.match a{color:#f5a16b;font-size:12px;text-decoration:none}.match a:hover{text-decoration:underline}.match img{display:block;width:100%;height:90px;object-fit:contain;background:white}.match-note{font-size:12px;color:var(--muted);margin:12px 0 20px;line-height:1.5}
.refine{border-top:1px solid var(--line);padding-top:16px;margin-top:18px}.refine label{font-size:12px;color:var(--muted);display:block;margin-bottom:8px}.refine-row{display:flex;gap:10px}.refine input{min-width:0;flex:1;background:#19191d;color:#f5f5f5;border:1px solid var(--line);border-radius:8px;padding:11px 12px}.refine button{font-size:13px}.help{font-size:12px;line-height:1.5;color:var(--muted);margin:10px 0}.spinner{display:inline-block;width:13px;height:13px;border:2px solid #ffffff55;border-top-color:#fff;border-radius:50%;margin-right:9px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.spinner{animation:none}}@media(max-width:720px){main{width:calc(100% - 28px);padding-top:25px}header{margin-bottom:24px}header p{max-width:120px;text-align:right}.workspace{grid-template-columns:1fr;gap:22px}.upload,#preview{min-height:230px;height:230px}.empty{min-height:160px}.empty p{max-width:320px}.result-heading h2{font-size:20px}.refine-row{gap:7px}.refine button{padding:10px}}
</style>
</head>
<body><main>
<header><h1>FontSense<span class="brand-dot">.</span></h1><p>Find similar fonts</p></header>
<section class="workspace" aria-label="Font finder">
<div><div id="upload" class="upload">
<input id="file-input" class="file-input" type="file" accept="image/png,image/jpeg,image/webp,.png,.jpg,.jpeg,.webp" aria-label="Choose a text image">
<label id="upload-label" for="file-input"><strong>Drop a text image here</strong><span>or click to browse · PNG, JPG, WebP</span></label>
<img id="preview" alt="Uploaded text" hidden><button id="remove" class="remove" type="button" hidden>Remove</button>
</div><div class="actions"><button id="find" class="primary" type="button" disabled>Find fonts</button><button id="reset" class="secondary" type="button">Reset</button></div><p id="status" class="status" role="status"></p></div>
<div><div id="empty" class="empty"><h2>Your matches appear here</h2><p>Choose an image with one clear line of text.</p></div>
<section id="results" aria-label="Font matches" hidden><div class="result-heading"><h2>Closest matches</h2><span id="category" class="pill"></span></div><div id="matches" aria-live="polite"></div><p id="match-note" class="match-note"></p>
<div class="refine"><label for="text-input">Text in your image</label><div class="refine-row"><input id="text-input" maxlength="80" spellcheck="false" autocomplete="off"><button id="refine" class="secondary" type="button">Refine</button></div><p id="text-help" class="help">Correct the text if needed to improve matching.</p></div>
</section></div></section></main>
<script>
const $=id=>document.getElementById(id);
const input=$('file-input'),upload=$('upload'),preview=$('preview'),label=$('upload-label'),find=$('find'),reset=$('reset'),remove=$('remove'),status=$('status'),results=$('results'),empty=$('empty'),matches=$('matches'),textInput=$('text-input'),refine=$('refine');
const labels={serif:'Serif',sans_serif:'Sans serif',monospace:'Monospace',display:'Display',handwriting:'Handwriting'};
const MAX_SOURCE_BYTES = 25 * 1024 * 1024;
const MAX_UPLOAD_BYTES=4*1024*1024,MAX_PIXELS=40_000_000;
let selected=null,previewUrl=null,version=0,active=null,preparing=false;
const resultCache=new Map();
function message(text,error=false){status.textContent=text;status.className='status'+(error?' error':'');}
function buttons(){find.disabled=!selected||preparing||Boolean(active);refine.disabled=!selected||Boolean(active);find.replaceChildren();if(active){const spin=document.createElement('span');spin.className='spinner';spin.setAttribute('aria-hidden','true');find.append(spin);}find.append(document.createTextNode(active?'Finding matches…':'Find fonts'));}
function cancel(){if(active)active.abort();active=null;buttons();}
function clear(){version++;selected=null;preparing=false;cancel();input.value='';textInput.value='';if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl=null;preview.removeAttribute('src');preview.hidden=true;label.hidden=false;remove.hidden=true;results.hidden=true;empty.hidden=false;matches.replaceChildren();message('');resultCache.clear();buttons();}
async function prepareImageForUpload(file){
const bitmap=await createImageBitmap(file,{imageOrientation:'from-image'});
try{if(!bitmap.width||!bitmap.height||bitmap.width*bitmap.height>MAX_PIXELS)throw new Error('Image too large. Crop the text and try again.');
const scale=Math.min(1,1800/Math.max(bitmap.width,bitmap.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));
const context=canvas.getContext('2d',{alpha:false});context.fillStyle='white';context.fillRect(0,0,canvas.width,canvas.height);context.drawImage(bitmap,0,0,canvas.width,canvas.height);
const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.95));if(!blob||blob.size>MAX_UPLOAD_BYTES)throw new Error('Crop the text into a smaller image.');return blob;
}finally{bitmap.close();}}
async function choose(file){
if(!file)return;clear();const thisVersion=version;if(file.size>MAX_SOURCE_BYTES){message('Choose an image smaller than 25 MB.',true);return;}
if(!/\.(png|jpe?g|webp)$/i.test(file.name)&&!['image/png','image/jpeg','image/webp'].includes(file.type)){message('Choose a PNG, JPG or WebP image.',true);return;}
preparing=true;buttons();message('Preparing image…');try{const prepared=await prepareImageForUpload(file);if(thisVersion!==version)return;selected=prepared;previewUrl=URL.createObjectURL(prepared);preview.src=previewUrl;preview.hidden=false;label.hidden=true;remove.hidden=false;message('');}
catch(error){if(thisVersion===version)message(error.message||'This image could not be opened.',true);}finally{if(thisVersion===version){preparing=false;buttons();}}}
function render(data){
matches.replaceChildren();empty.hidden=true;results.hidden=false;$('category').textContent=(data.match_strength==='uncertain'?'Possible ':'')+(labels[data.category]||data.category);textInput.value=data.text||'';
for(const [index,font] of data.matches.slice(0,3).entries()){
const card=document.createElement('article');card.className='match';const top=document.createElement('div');top.className='match-top';const name=document.createElement('div');name.className='match-name';const rank=document.createElement('span');rank.className='rank';rank.textContent=String(index+1).padStart(2,'0');const title=document.createElement('h3');title.textContent=font.family;name.append(rank,title);
const link=document.createElement('a');link.textContent='Get font';link.href=font.url;link.target='_blank';link.rel='noopener noreferrer';top.append(name,link);
const image=document.createElement('img');image.src=font.preview;image.alt=font.family+' preview';image.loading='lazy';card.append(top,image);matches.append(card);}
$('match-note').textContent=data.needs_text?'Enter the text below to find similar fonts.':data.match_strength==='uncertain'?'Possible alternatives. A clearer crop can improve the matches.':'Visual matches from our font library; the original font may differ.';
$('text-help').textContent=data.needs_text?'We couldn’t read this crop clearly. Type the visible text and select Refine.':'Correct the text if needed to improve matching.';
message(data.needs_text?'Text needs checking':'Matched in '+(data.elapsed_ms/1000).toFixed(2)+'s');}
async function identify(useText=false){
if(!selected||active)return;const text=useText?textInput.value.trim():'';if(useText&&text.length<2){message('Enter at least two visible characters.',true);return;}
const key=version+'|'+text;if(resultCache.has(key)){render(resultCache.get(key));return;}
const thisVersion=version,controller=new AbortController();active=controller;buttons();message('Comparing fonts…');const timer=setTimeout(()=>controller.abort(),30000);
try{const response=await fetch('/identify'+(text?'?text='+encodeURIComponent(text):''),{method:'POST',headers:{'Content-Type':selected.type},body:selected,signal:controller.signal});
const data=await response.json();if(thisVersion!==version||active!==controller)return;if(!response.ok)throw new Error(data.detail||'Matching failed. Try a clearer crop.');resultCache.set(key,data);render(data);}
catch(error){if(thisVersion===version&&active===controller)message(error.name==='AbortError'?'This took too long. Please try again.':error.message||'Matching failed.',true);}
finally{clearTimeout(timer);if(active===controller){active=null;buttons();}}}
input.addEventListener('change',()=>choose(input.files[0]));find.addEventListener('click',()=>identify());refine.addEventListener('click',()=>identify(true));textInput.addEventListener('keydown',event=>{if(event.key==='Enter')identify(true);});reset.addEventListener('click',clear);remove.addEventListener('click',clear);
for(const name of ['dragenter','dragover'])upload.addEventListener(name,event=>{event.preventDefault();upload.classList.add('dragging');});for(const name of ['dragleave','drop'])upload.addEventListener(name,event=>{event.preventDefault();upload.classList.remove('dragging');});upload.addEventListener('drop',event=>choose(event.dataTransfer.files[0]));
</script></body></html>
